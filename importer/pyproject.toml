[project]
name = "photolibre-importer"
version = "0.1.0"
description = "Apple Photos/iPhoto library exporter (Source A/B) を photolibre の archive.db + XMP サイドカー形式に統合するインポーター"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/photolibre_importer"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
